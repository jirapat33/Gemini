<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อเข้าฝึกงาน</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">📌 เช็คชื่อเข้าฝึกงาน</h2>
        
        <form id="attendanceForm" class="space-y-4">
            <!-- ข้อมูลนักศึกษา -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">รหัสนักศึกษา</label>
                <input type="text" id="studentId" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อ-นามสกุล</label>
                <input type="text" id="studentName" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- ส่วนของกล้อง -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">📸 ถ่ายรูปยืนยันตัวตน</label>
                <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-inner">
                    <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
                    <canvas id="canvas" class="hidden"></canvas>
                    <img id="photoPreview" class="hidden w-full h-full object-cover absolute top-0 left-0">
                </div>
                <div class="flex gap-2 mt-2">
                    <button type="button" id="captureBtn" class="flex-1 py-2 bg-blue-600 text-white font-medium rounded-xl hover:bg-blue-700 active:scale-95 transition">กดถ่ายรูป</button>
                    <button type="button" id="retakeBtn" class="hidden flex-1 py-2 bg-slate-500 text-white font-medium rounded-xl hover:bg-slate-600 active:scale-95 transition">ถ่ายใหม่</button>
                </div>
            </div>

            <!-- ตำแหน่ง GPS -->
            <div class="bg-slate-100 p-3 rounded-xl border border-slate-200">
                <span class="text-xs text-slate-500 block">พิกัดปัจจุบัน (GPS)</span>
                <span id="locationStatus" class="text-sm font-medium text-amber-600">กำลังดึงตำแหน่ง...</span>
            </div>

            <!-- ปุ่มส่งข้อมูล -->
            <button type="submit" id="submitBtn" disabled class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed transition shadow-lg">
                บันทึกเวลาเข้างาน
            </button>
        </form>
    </div>

    <script>
        // ใส่ Web App URL ที่ได้จาก Google Apps Script ที่นี่
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwZF391Jjl6JzlyzlTmH0xOhJ71IJDnQS07RWZvvfVYkIZ9F4rZzpicQFwLN_cqVgAJ/exec";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photoPreview = document.getElementById('photoPreview');
        const captureBtn = document.getElementById('captureBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        const locationStatus = document.getElementById('locationStatus');
        const submitBtn = document.getElementById('submitBtn');
        
        let base64Image = null;
        let currentCoordinates = null;

        // 1. เริ่มทำงานดึงกล้องหน้า
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("ไม่สามารถเข้าถึงกล้องได้ กรุณาอนุญาตสิทธิ์"); });

        // 2. ดึงตำแหน่ง GPS อัตโนมัติ
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentCoordinates = `${position.coords.latitude}, ${position.coords.longitude}`;
                    locationStatus.innerText = `📍 ${currentCoordinates}`;
                    locationStatus.classList.remove('text-amber-600');
                    locationStatus.classList.add('text-emerald-600');
                    checkReady();
                },
                (error) => {
                    locationStatus.innerText = "❌ ไม่สามารถดึงตำแหน่งได้ กรุณาเปิด GPS";
                    alert("กรุณาเปิดและอนุญาตสิทธิ์การเข้าถึงตำแหน่งย้อนหลัง");
                }
            );
        }

        // 3. ฟังก์ชันถ่ายรูปและย่อขนาดภาพ
        captureBtn.addEventListener('click', () => {
            const ctx = canvas.getContext('2d');
            // ตั้งความละเอียดรูปสำหรับส่งประหยัด Data (640x480)
            canvas.width = 640;
            canvas.height = 480;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            base64Image = canvas.toDataURL('image/jpeg', 0.7); // คุณภาพ 70% เพื่อประหยัดพื้นที่ใน Drive
            photoPreview.src = base64Image;
            
            photoPreview.classList.remove('hidden');
            retakeBtn.classList.remove('hidden');
            captureBtn.classList.add('hidden');
            checkReady();
        });

        retakeBtn.addEventListener('click', () => {
            base64Image = null;
            photoPreview.classList.add('hidden');
            retakeBtn.classList.add('hidden');
            captureBtn.classList.remove('hidden');
            checkReady();
        });

        function checkReady() {
            if (base64Image && currentCoordinates) {
                submitBtn.removeAttribute('disabled');
            } else {
                submitBtn.setAttribute('disabled', 'true');
            }
        }

        // 4. ส่งข้อมูลเข้า Google Sheets
        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.innerText = "กำลังบันทึกข้อมูล...";
            submitBtn.setAttribute('disabled', 'true');

            const payload = {
                studentId: document.getElementById('studentId').value,
                studentName: document.getElementById('studentName').value,
                location: currentCoordinates,
                image: base64Image
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    alert("บันทึกเวลาเรียนสำเร็จแล้ว!");
                    location.reload();
                } else {
                    alert("เกิดข้อผิดพลาด: " + data.message);
                    submitBtn.innerText = "บันทึกเวลาเข้างาน";
                    submitBtn.removeAttribute('disabled');
                }
            })
            .catch(err => {
                alert("ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
                submitBtn.innerText = "บันทึกเวลาเข้างาน";
                submitBtn.removeAttribute('disabled');
            });
        });
    </script>
</body>
</html>
