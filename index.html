<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกเวลาฝึกงาน</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-xl border border-slate-200 space-y-5">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-slate-800">📷 บันทึกเวลาเข้างาน</h1>
            <p class="text-slate-400 text-xs mt-1">กรุณากรอกรหัสประจำตัวและถ่ายภาพเพื่อเช็คชื่อ</p>
        </div>

        <div class="space-y-1.5">
            <label class="text-sm font-semibold text-slate-700">รหัสนักศึกษา</label>
            <input type="text" id="studentId" oninput="autoFillProfile()" placeholder="กรอกรหัสนักศึกษาเพื่อดึงข้อมูล" 
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="space-y-1.5 bg-slate-50 p-3 rounded-xl text-xs text-slate-600 border border-slate-200">
            <div><strong>ชื่อ-นามสกุล:</strong> <span id="lblStudentName">-</span></div>
            <input type="hidden" id="studentName" value="">
        </div>

        <div class="space-y-1.5">
            <label class="text-sm font-semibold text-slate-700">กล้องถ่ายรูป</label>
            <div class="relative bg-black rounded-xl overflow-hidden aspect-video flex items-center justify-center border border-slate-300">
                <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="canvas" class="hidden w-full h-full object-cover"></canvas>
                <img id="photoPreview" class="hidden absolute top-0 left-0 w-full h-full object-cover z-10">
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="startCamera()" class="flex-1 py-2 bg-slate-800 text-white text-xs font-medium rounded-lg hover:bg-slate-900 transition">📸เปิดกล้อง</button>
                <button type="button" onclick="takeSnapshot()" class="flex-1 py-2 bg-blue-600 text-white text-xs font-medium rounded-lg hover:bg-blue-700 transition">📸 ถ่ายรูป</button>
            </div>
        </div>

        <div class="space-y-1">
            <button type="button" onclick="getLocation()" class="w-full py-2 bg-teal-600 text-white text-xs font-medium rounded-lg hover:bg-teal-700 transition">📍 ดึงพิกัด GPS ปัจจุบัน</button>
            <p id="geoStatus" class="text-[11px] text-center text-slate-400">ยังไม่มีพิกัด</p>
        </div>

        <button type="button" id="submitBtn" onclick="submitCheckIn()" 
                class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-md hover:bg-emerald-700 transition text-sm">
            🚀 บันทึกเวลาเข้างาน
        </button>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz72KNiggt48UgUplUaCGUIK0v_-jqcevE4DbyOc9y1m67ZPl3yUFXz2mkoBV8ldTtn/exec";

        let currentCoords = "";
        let base64Image = "";

        // 1. ดึงโปรไฟล์อัตโนมัติ
        function autoFillProfile() {
            const id = document.getElementById('studentId').value.trim();
            if(id.length < 5) return;

            fetch(`${WEB_APP_URL}?studentId=${id}`)
            .then(res => res.json())
            .then(data => {
                if(data.profile && data.profile.name) {
                    document.getElementById('lblStudentName').innerText = data.profile.name;
                    document.getElementById('studentName').value = data.profile.name;
                } else {
                    document.getElementById('lblStudentName').innerText = "❌ ไม่พบรายชื่อรหัสนี้";
                    document.getElementById('studentName').value = "";
                }
            });
        }

        // 2. จัดการเรื่องกล้องหน้าบ้าน
        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                document.getElementById('video').srcObject = stream;
                document.getElementById('photoPreview').classList.add('hidden');
            }).catch(err => alert("ไม่สามารถเปิดกล้องได้:กรุณาเปิดสิทธิ์"));
        }

        function takeSnapshot() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const preview = document.getElementById('photoPreview');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            base64Image = canvas.toDataURL('image/jpeg', 0.7);
            preview.src = base64Image;
            preview.classList.remove('hidden');
        }

        // 3. ขอพิกัด GPS
        function getLocation() {
            const status = document.getElementById('geoStatus');
            if(!navigator.geolocation) return status.innerText = "เบราวเซอร์ไม่รองรับ GPS";
            
            status.innerText = "⏳ กำลังดึงพิกัด...";
            navigator.geolocation.getCurrentPosition(pos => {
                currentCoords = `${pos.coords.latitude},${pos.coords.longitude}`;
                status.innerText = "✅ เก็บพิกัด GPS สำเร็จ: " + currentCoords;
            }, () => status.innerText = "❌ ไม่สามารถดึงพิกัดได้");
        }

        // 4. ฟังก์ชันส่งข้อมูลเช็คชื่อ (ล็อกปุ่มกดส่งเบิ้ลถาวร)
        function submitCheckIn() {
            const sId = document.getElementById('studentId').value.trim();
            const sName = document.getElementById('studentName').value;
            const submitBtn = document.getElementById('submitBtn');

            if(!sId || !sName) return alert("กรุณากรอกรหัสนักศึกษาให้ถูกต้อง");
            if(!base64Image) return alert("กรุณากดถ่ายภาพก่อนบันทึก");
            if(!currentCoords) return alert("กรุณากดดึงพิกัด GPS ก่อนบันทึก");

            // 🌟 ปิดการทำงานปุ่มทันทีกด ป้องกันการเบิ้ลนิ้วกดรัวๆ
            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ กำลังส่งบันทึกเวลาเข้างาน...";
            submitBtn.className = "w-full py-3 bg-slate-400 text-white font-bold rounded-xl cursor-not-allowed";

            const payload = {
                studentId: sId,
                studentName: sName,
                location: currentCoords,
                image: base64Image
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    alert("🎯 ระบบบันทึกเวลาของวันนี้สำเร็จเรียบร้อยแล้ว!");
                    // เปลี่ยนป้ายถาวร ล็อกยาวจนกว่าจะเปิดวันใหม่
                    submitBtn.innerText = "✅ บันทึกสำเร็จแล้ววันนี้";
                    submitBtn.className = "w-full py-3 bg-emerald-500 text-white font-bold rounded-xl cursor-not-allowed";
                } else {
                    alert("เกิดข้อผิดพลาดจากระบบ: " + data.message);
                    // ปลดล็อกปุ่มให้ส่งใหม่ได้ถ้าเกิดเออเร่อ
                    submitBtn.disabled = false;
                    submitBtn.innerText = "🚀 บันทึกเวลาเข้างาน";
                    submitBtn.className = "w-full py-3 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition";
                }
            })
            .catch(err => {
                alert("ไม่สามารถติดต่อหลังบ้านได้");
                submitBtn.disabled = false;
                submitBtn.innerText = "🚀 บันทึกเวลาเข้างาน";
                submitBtn.className = "w-full py-3 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition";
            });
        }
    </script>
</body>
</html>
