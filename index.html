<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกเวลาฝึกงาน</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <nav class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-xl">📅</span>
                <span class="font-bold tracking-wide text-sm sm:text-base">ระบบบันทึกเวลาฝึกงาน</span>
            </div>
            <div class="flex gap-2 sm:gap-4 text-xs sm:text-sm">
                <a href="index.html" class="px-3 py-1.5 bg-slate-800 rounded-lg font-medium border border-blue-500 text-blue-400">
                    📸 บันทึกเวลา
                </a>
                <a href="profile.html" class="px-3 py-1.5 hover:bg-slate-800 rounded-lg font-medium text-slate-300 transition">
                    👤 โปรไฟล์/ปฏิทิน
                </a>
                <a href="dashboard.html" class="px-3 py-1.5 hover:bg-slate-800 rounded-lg font-medium text-slate-300 transition">
                    📊 สถิติภาพรวม
                </a>
            </div>
        </div>
    </nav>

    <div class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-xl bg-white p-6 rounded-2xl shadow-xl border border-slate-200 space-y-5 my-4">
            
            <div class="text-center">
                <h1 class="text-2xl font-bold text-slate-800">📸 บันทึกเวลาเข้างาน</h1>
                <p class="text-slate-400 text-xs mt-1">กรุณากรอกรหัสประจำตัว ถ่ายภาพ และเช็คพิกัดเพื่อบันทึกเวลา</p>
            </div>

            <div class="space-y-1.5">
                <label class="text-sm font-semibold text-slate-700">รหัสนักศึกษา</label>
                <input type="text" id="studentId" oninput="autoFillProfile()" placeholder="กรอกรหัสนักศึกษาเพื่อดึงข้อมูลอัตโนมัติ" 
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="space-y-1.5 bg-slate-50 p-3 rounded-xl text-xs text-slate-600 border border-slate-200">
                <div><strong>ชื่อ-นามสกุล:</strong> <span id="lblStudentName">-</span></div>
                <input type="hidden" id="studentName" value="">
            </div>

            <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700 block">กล้องถ่ายรูป</label>
                
                <div class="relative bg-slate-950 rounded-2xl overflow-hidden aspect-video flex items-center justify-center border-2 border-slate-300 shadow-inner w-full">
                    <video id="video" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
                    <canvas id="canvas" class="hidden w-full h-full object-cover"></canvas>
                    <img id="photoPreview" class="hidden absolute top-0 left-0 w-full h-full object-cover z-10 transform -scale-x-100">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="startCamera()" class="py-2.5 bg-slate-800 text-white text-xs sm:text-sm font-bold rounded-xl hover:bg-slate-900 transition flex items-center justify-center gap-1.5 shadow-xs">
                        📷 เปิดกล้อง
                    </button>
                    <button type="button" onclick="takeSnapshot()" class="py-2.5 bg-blue-600 text-white text-xs sm:text-sm font-bold rounded-xl hover:bg-blue-700 transition flex items-center justify-center gap-1.5 shadow-xs">
                        📸 ถ่ายรูปภาพ
                    </button>
                </div>
            </div>

            <div class="space-y-1.5 pt-1">
                <button type="button" onclick="getLocation()" class="w-full py-2.5 bg-teal-600 text-white text-xs sm:text-sm font-bold rounded-xl hover:bg-teal-700 transition shadow-xs flex items-center justify-center gap-1">
                    📍 ดึงพิกัด GPS ปัจจุบัน
                </button>
                <p id="geoStatus" class="text-[11px] text-center font-medium text-slate-500 bg-slate-100 py-1 rounded-md border border-slate-200">ยังไม่มีข้อมูลพิกัด</p>
            </div>

            <div class="pt-2">
                <button type="button" id="submitBtn" onclick="submitCheckIn()" 
                        class="w-full py-3.5 bg-emerald-600 text-white font-bold rounded-xl shadow-md hover:bg-emerald-700 transition text-sm sm:text-base cursor-pointer">
                    🚀 ส่งข้อมูลและบันทึกเวลาเข้างาน
                </button>
            </div>
            
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz72KNiggt48UgUplUaCGUIK0v_-jqcevE4DbyOc9y1m67ZPl3yUFXz2mkoBV8ldTtn/exec";

        let currentCoords = "";
        let base64Image = "";

        // 1. ค้นหาดึงประวัติโปรไฟล์อัตโนมัติเมื่อคีย์รหัสเด็ก
        function autoFillProfile() {
            const id = document.getElementById('studentId').value.trim();
            if(id.length < 5) return;

            fetch(`${WEB_APP_URL}?studentId=${id}`)
            .then(res => res.json())
            .then(data => {
                if(data.profile && data.profile.name) {
                    document.getElementById('lblStudentName').innerText = data.profile.name;
                    document.getElementById('studentName').value = data.profile.name;
                } else {
                    document.getElementById('lblStudentName').innerText = "❌ ไม่พบรายชื่อในระบบฐานข้อมูล";
                    document.getElementById('studentName').value = "";
                }
            });
        }

        // 2. เรียกใช้งานฟังก์ชันเปิดกล้องเว็บแคม
        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 1280, height: 720 } })
            .then(stream => {
                document.getElementById('video').srcObject = stream;
                document.getElementById('photoPreview').classList.add('hidden');
                base64Image = ""; // รีเซ็ตค่าภาพนิ่งเดิม
            }).catch(err => alert("ไม่สามารถเปิดใช้งานกล้องได้: กรุณาตรวจสอบการอนุญาตสิทธิ์บนเบราว์เซอร์"));
        }

        // 3. ฟังก์ชันจับภาพนิ่ง (Snapshot)
        function takeSnapshot() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const preview = document.getElementById('photoPreview');
            
            if(!video.srcObject) return alert("กรุณากดเปิดกล้องก่อนถ่ายรูปภาพครับ");

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            base64Image = canvas.toDataURL('image/jpeg', 0.8);
            preview.src = base64Image;
            preview.classList.remove('hidden');
        }

        // 4. สั่งตรวจสอบเรียกพิกัดจากตัวเครื่องอุปกรณ์ (GPS Location)
        function getLocation() {
            const status = document.getElementById('geoStatus');
            if(!navigator.geolocation) return status.innerText = "อุปกรณ์นี้ไม่รองรับระบบ GPS ข้อมูลตำแหน่ง";
            
            status.innerText = "⏳ ระบบกำลังเชื่อมต่อดาวเทียมเพื่อจับพิกัด...";
            navigator.geolocation.getCurrentPosition(pos => {
                currentCoords = `${pos.coords.latitude},${pos.coords.longitude}`;
                status.innerText = "✅ บันทึกตำแหน่งสำเร็จ: " + currentCoords;
            }, () => status.innerText = "❌ เกิดข้อผิดพลาด ไม่สามารถเข้าถึงตำแหน่งที่ตั้งได้");
        }

        // 5. ส่งแพ็กเก็ตข้อมูลยิงไปฝั่งโฮสต์หลังบ้าน Sheets
        function submitCheckIn() {
            const sId = document.getElementById('studentId').value.trim();
            const sName = document.getElementById('studentName').value;
            const submitBtn = document.getElementById('submitBtn');

            if(!sId || !sName) return alert("กรุณาป้อนรหัสนักศึกษาให้สมบูรณ์และถูกต้อง");
            if(!base64Image) return alert("กรุณากดแชะถ่ายรูปก่อนกดส่งบันทึกเวลา");
            if(!currentCoords) return alert("กรุณากดตรวจสอบจับพิกัดสถานที่ฝึกงานก่อนส่งครับ");

            // ล็อกปุ่มกดทันที เพื่อป้องกันปัญหาการดับเบิ้ลคลิกซ้ำซ้อน
            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ ระบบกำลังส่งข้อมูล โปรดรอสักครู่...";
            submitBtn.className = "w-full py-3.5 bg-slate-400 text-white font-bold rounded-xl cursor-not-allowed text-sm sm:text-base";

            const payload = {
                studentId: sId,
                studentName: sName,
                location: currentCoords,
                image: base64Image
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    alert("🎯 ระบบลงเวลาของวันนี้ให้สำเร็จเรียบร้อยแล้วครับ!");
                    // เปลี่ยนปุ่มสถานะล็อกถาวรรายวัน
                    submitBtn.innerText = "✅ บันทึกสำเร็จแล้ววันนี้";
                    submitBtn.className = "w-full py-3.5 bg-emerald-500 text-white font-bold rounded-xl cursor-not-allowed text-sm sm:text-base";
                } else {
                    alert("เกิดปัญหาข้อขัดข้อง: " + data.message);
                    resetSubmitButton();
                }
            })
            .catch(err => {
                alert("ไม่สามารถติดต่อช่องทางรับข้อมูลหลังบ้านได้");
                resetSubmitButton();
            });
        }

        function resetSubmitButton() {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.innerText = "🚀 ส่งข้อมูลและบันทึกเวลาเข้างาน";
            submitBtn.className = "w-full py-3.5 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition text-sm sm:text-base cursor-pointer";
        }
    </script>
</body>
</html>
