<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบเช็คชื่อเข้าฝึกงาน</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-b from-slate-900 to-slate-800 min-h-screen flex items-center justify-center p-3 sm:p-6">

    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-slate-100 flex flex-col my-auto">
        
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-white text-center shadow-md">
            <h2 class="text-2xl font-bold tracking-wide flex items-center justify-center gap-2">
                <span>📌</span> เช็คชื่อเข้าฝึกงาน
            </h2>
            <p class="text-blue-100 text-xs mt-1 font-light tracking-wider">โปรดบันทึกเวลาและพิกัด ณ สถานที่ฝึกงานจริง</p>
        </div>
        
        <form id="attendanceForm" class="p-5 sm:p-6 space-y-5 flex-1 overflow-y-auto">
            
            <div class="grid grid-cols-1 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">รหัสนักศึกษา</label>
                    <div class="relative">
                        <input type="text" id="studentId" required placeholder="เช่น 64xxxxxxx"
                               class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-base text-slate-800 font-medium focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white focus:outline-none transition-all">
                        <span id="loadingName" class="hidden absolute right-4 top-3.5 text-xs text-blue-600 animate-pulse">⏳ กำลังค้นหาชื่อ...</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">ชื่อ - นามสกุล</label>
                    <input type="text" id="studentName" required readonly placeholder="กรุณากรอกรหัสนักศึกษาเพื่อดึงชื่อ"
                           class="w-full px-4 py-3 bg-slate-100 border border-slate-200 rounded-xl text-base text-slate-500 font-medium cursor-not-allowed focus:outline-none transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                    <span>📸</span> ถ่ายรูปยืนยันตัวตน (กล้องหน้า)
                </label>
                <div class="relative w-full aspect-square bg-slate-900 rounded-2xl overflow-hidden shadow-inner border border-slate-200 group">
                    <video id="video" autoplay playsinline class="w-full h-full object-cover scale-x-[-1]"></video>
                    <canvas id="canvas" class="hidden"></canvas>
                    <img id="photoPreview" class="hidden w-full h-full object-cover absolute top-0 left-0 scale-x-[-1]">
                    
                    <div id="cameraGuide" class="absolute inset-8 border-2 border-dashed border-white/40 rounded-full pointer-events-none flex items-center justify-center">
                        <span class="text-[10px] text-white/50 bg-black/40 px-2 py-0.5 rounded-full font-light">จัดใบหน้าให้อยู่ในกรอบ</span>
                    </div>
                </div>
                
                <div class="mt-3">
                    <button type="button" id="captureBtn" class="w-full py-3.5 bg-blue-600 text-white font-bold text-base rounded-xl hover:bg-blue-700 active:scale-[0.98] transition-all shadow-md shadow-blue-600/20 flex items-center justify-center gap-2">
                        📷 กดถ่ายรูปเซลฟี่
                    </button>
                    <button type="button" id="retakeBtn" class="hidden w-full py-3.5 bg-slate-600 text-white font-medium text-base rounded-xl hover:bg-slate-700 active:scale-[0.98] transition-all shadow-md flex items-center justify-center gap-2">
                        🔄 ถ่ายรูปใหม่
                    </button>
                </div>
            </div>

            <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/60 flex items-center justify-between gap-3">
                <div class="flex-1">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-0.5">พิกัดสถานที่ปัจจุบัน</span>
                    <span id="locationStatus" class="text-sm font-semibold text-amber-600 flex items-center gap-1">
                        <span class="animate-pulse">⏳</span> กำลังดึงข้อมูลตำแหน่ง GPS...
                    </span>
                </div>
                <div id="gpsIcon" class="w-8 h-8 rounded-lg bg-amber-50 border border-amber-200 flex items-center justify-center text-base">🛰️</div>
            </div>

            <button type="submit" id="submitBtn" disabled 
                    class="w-full py-4 bg-emerald-600 text-white font-bold text-lg rounded-xl hover:bg-emerald-700 active:scale-[0.98] disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed disabled:active:scale-100 transition-all shadow-xl shadow-emerald-600/10 mt-2">
                🚀 บันทึกเวลาเข้างาน
            </button>
        </form>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz72KNiggt48UgUplUaCGUIK0v_-jqcevE4DbyOc9y1m67ZPl3yUFXz2mkoBV8ldTtn/exec";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photoPreview = document.getElementById('photoPreview');
        const captureBtn = document.getElementById('captureBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        const locationStatus = document.getElementById('locationStatus');
        const gpsIcon = document.getElementById('gpsIcon');
        const cameraGuide = document.getElementById('cameraGuide');
        const submitBtn = document.getElementById('submitBtn');
        
        let base64Image = null;
        let currentCoordinates = null;

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 640 } } })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { alert("ระบบไม่สามารถเข้าถึงกล้องหน้าได้ โปรดกดยอมรับสิทธิ์กล้อง"); });

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentCoordinates = `${position.coords.latitude}, ${position.coords.longitude}`;
                    locationStatus.innerText = `📍 ${currentCoordinates}`;
                    locationStatus.className = "text-sm font-semibold text-emerald-600";
                    gpsIcon.className = "w-8 h-8 rounded-lg bg-emerald-50 border border-emerald-200 flex items-center justify-center text-base";
                    gpsIcon.innerText = "🎯";
                    checkReady();
                },
                (error) => {
                    locationStatus.innerText = "❌ ไม่สามารถดึงตำแหน่งได้ กรุณาเปิด GPS";
                    locationStatus.className = "text-sm font-semibold text-rose-600";
                    gpsIcon.className = "w-8 h-8 rounded-lg bg-rose-50 border border-rose-200 flex items-center justify-center text-base";
                    gpsIcon.innerText = "✖️";
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // ตรวจจับพิมพ์รหัสครบ 10 หลัก (หากสถาบันคุณใช้จำนวนอื่น ให้แก้เลข 10 ตรงนี้ได้ครับ)
        document.getElementById('studentId').addEventListener('input', function(e) {
            const studentId = e.target.value.trim();
            const nameInput = document.getElementById('studentName');
            const loadingText = document.getElementById('loadingName');

            if (studentId.length >= 10) {
                loadingText.classList.remove('hidden');
                fetch(`${WEB_APP_URL}?studentId=${studentId}`)
                    .then(res => res.json())
                    .then(data => {
                        loadingText.classList.add('hidden');
                        if (data.profile && data.profile.name) {
                            nameInput.value = data.profile.name;
                            nameInput.className = "w-full px-4 py-3 bg-emerald-50 border border-emerald-300 rounded-xl text-base text-slate-800 font-medium focus:outline-none transition-all";
                        } else {
                            nameInput.value = "";
                            alert("❌ ไม่พบรหัสนักศึกษานี้ในระบบฐานข้อมูล");
                            resetNameInput(nameInput);
                        }
                        checkReady();
                    })
                    .catch(err => { loadingText.classList.add('hidden'); resetNameInput(nameInput); });
            } else {
                resetNameInput(nameInput);
            }
        });

        function resetNameInput(input) {
            input.value = "";
            input.className = "w-full px-4 py-3 bg-slate-100 border border-slate-200 rounded-xl text-base text-slate-500 font-medium cursor-not-allowed focus:outline-none transition-all";
            checkReady();
        }

        captureBtn.addEventListener('click', () => {
            const ctx = canvas.getContext('2d');
            canvas.width = 600; canvas.height = 600;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            base64Image = canvas.toDataURL('image/jpeg', 0.65);
            photoPreview.src = base64Image;
            photoPreview.classList.remove('hidden');
            retakeBtn.classList.remove('hidden');
            captureBtn.classList.add('hidden');
            cameraGuide.classList.add('hidden');
            checkReady();
        });

        retakeBtn.addEventListener('click', () => {
            base64Image = null;
            photoPreview.classList.add('hidden');
            retakeBtn.classList.add('hidden');
            captureBtn.classList.remove('hidden');
            cameraGuide.classList.remove('hidden');
            checkReady();
        });

        function checkReady() {
            const nameInput = document.getElementById('studentName').value;
            if (base64Image && currentCoordinates && nameInput) {
                submitBtn.removeAttribute('disabled');
            } else {
                submitBtn.setAttribute('disabled', 'true');
            }
        }

        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.innerText = "⏳ กำลังบันทึกเวลาลงระบบ...";
            submitBtn.setAttribute('disabled', 'true');

            const payload = {
                studentId: document.getElementById('studentId').value,
                studentName: document.getElementById('studentName').value,
                location: currentCoordinates,
                image: base64Image
            };

            fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    location.reload(); // เคลียร์หน้าเงียบๆ ทันที
                } else {
                    alert("เกิดข้อผิดพลาด: " + data.message);
                    submitBtn.innerText = "🚀 บันทึกเวลาเข้างาน";
                    submitBtn.removeAttribute('disabled');
                }
            })
            .catch(err => {
                alert("การเชื่อมต่อล้มเหลว กรุณาลองใหม่อีกครั้ง");
                submitBtn.innerText = "🚀 บันทึกเวลาเข้างาน";
                submitBtn.removeAttribute('disabled');
            });
        });
    </script>
</body>
</html>
