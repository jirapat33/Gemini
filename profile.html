<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลส่วนตัวนักศึกษา</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        .fc-event { cursor: pointer; padding: 2px 4px; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4">

    <div id="loginSection" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
        <h2 class="text-2xl font-bold text-center mb-6">🔑 ดูประวัติการเช็คชื่อส่วนตัว</h2>
        <input type="text" id="inputId" placeholder="กรอกรหัสประจำตัวนักศึกษา" class="w-full px-4 py-3 border border-slate-300 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="loadProfile()" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition">เข้าสู่ระบบ</button>
    </div>

    <div id="profileSection" class="hidden max-w-5xl mx-auto space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-md border-t-4 border-blue-500">
            <div class="flex flex-wrap justify-between items-start">
                <div>
                    <h1 id="dispName" class="text-3xl font-bold text-slate-800">กำลังโหลด...</h1>
                    <p id="dispId" class="text-blue-600 font-medium mt-1"></p>
                </div>
                <button onclick="location.reload()" class="text-sm text-slate-400 hover:text-rose-500 underline font-medium">ออกจากระบบ</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6 text-sm">
                <div class="bg-slate-50 p-3 rounded-lg"><strong>ฝึกงานที่:</strong> <span id="dispFaculty">-</span></div>
                <div class="bg-slate-50 p-3 rounded-lg"><strong>แผนก/ตำแหน่งงาน:</strong> <span id="dispMajor">-</span></div>
                <div class="bg-slate-50 p-3 rounded-lg"><strong>อาจารย์ที่ปรึกษา:</strong> <span id="dispSup">-</span></div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
            <h3 class="text-lg font-bold mb-4 text-slate-700">📅 ปฏิทินบันทึกเวลาของฉัน</h3>
            <div id="calendar"></div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz72KNiggt48UgUplUaCGUIK0v_-jqcevE4DbyOc9y1m67ZPl3yUFXz2mkoBV8ldTtn/exec";

        function loadProfile() {
            const studentId = document.getElementById('inputId').value.trim();
            if(!studentId) return alert("กรุณากรอกรหัสประจำตัว");

            const loginSection = document.getElementById('loginSection');
            const profileSection = document.getElementById('profileSection');

            fetch(`${WEB_APP_URL}?studentId=${studentId}`)
            .then(res => res.json())
            .then(data => {
                if(!data.profile || !data.profile.id) {
                    alert("ไม่พบข้อมูลนักศึกษาคนนี้ในระบบ");
                    return;
                }

                loginSection.classList.add('hidden');
                profileSection.classList.remove('hidden');
                
                document.getElementById('dispName').innerText = data.profile.name;
                document.getElementById('dispId').innerText = "รหัสนักศึกษา: " + data.profile.id;
                document.getElementById('dispFaculty').innerText = data.profile.faculty;
                document.getElementById('dispMajor').innerText = data.profile.major;
                document.getElementById('dispSup').innerText = data.profile.supervisor;

                initCalendar(data.logs);
            });
        }

        function initCalendar(logs) {
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'th',
                events: logs.map(item => {
                    const checkInDate = new Date(item.Timestamp);
                    
                    // ปรับแต่งข้อความและสีบนปฏิทินให้ล้อตาม Dropdown ระบบใหม่
                    let titleText = '⏳ รอตรวจสอบ';
                    let colorHex = '#f59e0b'; // Amber-500

                    if (item.Status === 'Present' || item.Status === 'Correct') { titleText = '✅ มาทำงาน'; colorHex = '#10b981'; } 
                    else if (item.Status === 'Late') { titleText = '⏰ มาสาย'; colorHex = '#d97706'; } 
                    else if (item.Status === 'Sick') { titleText = '🧡 ลาป่วย'; colorHex = '#f97316'; } 
                    else if (item.Status === 'Holiday') { titleText = '💙 ลากิจ'; colorHex = '#3b82f6'; } 
                    else if (item.Status === 'Incorrect') { titleText = '❌ ขาดงาน'; colorHex = '#ef4444'; }

                    return {
                        title: titleText,
                        start: checkInDate.toISOString().split('T')[0],
                        color: colorHex
                    };
                })
            });
            calendar.render();
        }
    </script>
</body>
</html>
